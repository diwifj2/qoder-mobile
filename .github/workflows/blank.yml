
name: Download Qoder APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          mkdir -p downloads
          curl -fL --retry 3 \
            "https://download.qoder.com/qoder-mobile/latest/android/qoder.apk" \
            -o downloads/qoder.apk
          test -s downloads/qoder.apk

      - name: Upload to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/qoder.apk

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add Qoder APK"
          git push
